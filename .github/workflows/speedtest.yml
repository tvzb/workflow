name: IPTV自动测速排序

# 允许通过 API 手动触发 (workflow_dispatch)
on:
  workflow_dispatch:
    inputs:
      playlist:
        description: '前端传来的 Base64 播放列表'
        required: true

jobs:
  run-speed-test:
    runs-on: ubuntu-latest

    # 赋予工作流写入仓库的权限
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行测速脚本
        # 把前端 API 传过来的 playlist 变量喂给 python
        run: python speedtest.py "${{ github.event.inputs.playlist }}"

      - name: 将结果提交回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 修改点：将 result.txt 改为 iptv.txt
          git add iptv.txt
          # 如果没有变化就不提交，防止报错
          git commit -m "🚀 自动更新测速结果" || echo "无新数据更新"
          git push
