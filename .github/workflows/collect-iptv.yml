name: Collect CCTV & Weishi IPTV Sources

on:
  workflow_dispatch:
    inputs:
      max_per_channel:
        description: '每个频道最多保留多少个去重后的源（默认30）'
        required: false
        default: '30'
        type: string
      days:
        description: '优先搜索最近几天的更新（默认15）'
        required: false
        default: '15'
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 搜索较多，给足时间

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PER_CHANNEL: ${{ github.event.inputs.max_per_channel || '30' }}
          DAYS: ${{ github.event.inputs.days || '15' }}
        run: |
          python scripts/collect_iptv.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: iptv-sources-${{ github.run_number }}
          path: output/*.txt
          if-no-files-found: warn
          retention-days: 30
