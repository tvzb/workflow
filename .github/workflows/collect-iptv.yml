name: 频道直播源采集

on:
  workflow_dispatch:
    inputs:
      max_cctv:
        description: '央视频道每个最多保留多少个源（默认30）'
        required: false
        default: '30'
        type: string
      max_weishi:
        description: '卫视频道每个最多保留多少个源（默认15）'
        required: false
        default: '15'
        type: string
      days:
        description: '优先搜索最近几天的更新（默认15）'
        required: false
        default: '15'
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_CCTV: ${{ github.event.inputs.max_cctv || '30' }}
          MAX_WEISHI: ${{ github.event.inputs.max_weishi || '15' }}
          DAYS: ${{ github.event.inputs.days || '15' }}
        run: |
          python scripts/collect_iptv.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: iptv-sources-${{ github.run_number }}
          path: scripts/cctv_weishi_ipv4.txt
          if-no-files-found: warn
          retention-days: 30
