name: IPTV Live Stream Manual Updater

on:
  workflow_dispatch:
    inputs:
      remarks:
        description: '手动运行备注信息（选填）'
        required: false
        default: 'Manual update triggered'

permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装与配置 Python 环境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行直播源采集、清洗与测速 (Run Pipeline)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py

      - name: 提交并推流更新 live.txt (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt
          if git diff --staged --quiet; then
            echo "直播源无变更，跳过提交。"
          else
            git commit -m "chore(iptv): manually update live.txt [skip ci]"
            git push
          fi
