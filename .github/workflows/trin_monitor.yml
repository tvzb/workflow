name: A股阿姆氏数据r

on:
  # 支持在 GitHub 页面上点击“Run workflow”手动触发
  workflow_dispatch:
  
  # 定时自动运行：UTC 时间 07:10（对应北京时间 15:10，A 股收盘后自动计算）
  schedule:
    - cron: '10 7 * * 1-5'

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装所需依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 运行 TRIN 计算脚本
        run: |
          python calc_trin.py

      - name: 保存计算结果文件到仓库 (可选)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latest_trin.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新 A股 TRIN 指标 [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
