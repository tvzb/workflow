name: A股阿姆氏数据

on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1-5'

# 显式赋予写权限，防止 push 报 403
permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装所需依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 运行 TRIN 计算脚本
        run: |
          python calc_trin.py

      - name: 保存计算结果文件到仓库
        run: |
          if [ -f "latest_trin.txt" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add latest_trin.txt
            git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新 A股 TRIN 指标 [skip ci]" && git push)
          else
            echo "警告：未检测到 latest_trin.txt 文件，跳过本次提交"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
